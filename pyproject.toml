[project]
name = "hexdump-tool"
version = "0.1.0"
description = "hd (hexdump -C) 风格的字节转储工具"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["hex.py", "tests"]
